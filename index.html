  {en:"She doesn't want to go there.", tr:"[ши дАзнт wонт ту гОУ зЭэ]", ru:"Она не хочет идти туда.", w:[{e:"go there",t:"[гОУ зЭэ]",r:"идти туда"}]},
  {en:"It doesn't matter.", tr:"[ит дАзнт мЭтэ]", ru:"Это не имеет значения.", w:[{e:"matter",t:"[мЭтэ]",r:"иметь значение"}]},
  {en:"It doesn't help me.", tr:"[ит дАзнт хэлп ми:]", ru:"Это мне не помогает.", w:[{e:"help",t:"[хэлп]",r:"помогать"}]},
  {en:"He doesn't have a car.", tr:"[хи дАзнт хэв э кА:]", ru:"У него нет машины.", w:[{e:"have",t:"[хэв]",r:"иметь"}]},
  {en:"She doesn't have enough money.", tr:"[ши дАзнт хэв инАф мАни]", ru:"У неё недостаточно денег.", w:[{e:"enough",t:"[инАф]",r:"достаточно"},{e:"money",t:"[мАни]",r:"деньги"}]},
  {en:"My friend doesn't live in Moscow.", tr:"[май фрэнд дАзнт лив ин мОскоу]", ru:"Мой друг не живёт в Москве.", w:[{e:"my friend",t:"[май фрэнд]",r:"мой друг"}]},
  {en:"This thing doesn't interest me.", tr:"[зис синг дАзнт Интрэст ми:]", ru:"Эта вещь меня не интересует.", w:[{e:"thing",t:"[синг]",r:"вещь"},{e:"interest",t:"[Интрэст]",r:"интересовать"}]},
  {en:"I think it's a good idea.", tr:"[ай синк итс э гуд айдИэ]", ru:"Я думаю, это хорошая идея.", w:[{e:"think",t:"[синк]",r:"думать"},{e:"good idea",t:"[гуд айдИэ]",r:"хорошая идея"}]},
  {en:"I need your help.", tr:"[ай нИ:д йО: хэлп]", ru:"Мне нужна твоя помощь.", w:[{e:"need",t:"[нИ:д]",r:"нуждаться"},{e:"your",t:"[йО:]",r:"твой"}]},
  {en:"She needs this information.", tr:"[ши нИ:дз зис инфомЭЙшн]", ru:"Ей нужна эта информация.", w:[{e:"needs",t:"[нИ:дз]",r:"нуждается"},{e:"information",t:"[инфомЭЙшн]",r:"информация"}]}
];
const lessons = [L1, L2, L3];

// ===== Что умеет браузер =====
// Во встроенном браузере Telegram (Android) и в некоторых других нет голоса диктора и/или микрофона.
// Раньше из-за этого сайт падал. Теперь он просто работает без этих функций и показывает подсказку.
const HAS_TTS = !!window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  try { rec = new SR(); rec.lang = 'en-US'; rec.maxAlternatives = 5; } catch (e) { rec = null; }
}

// ===== Сохранение прогресса (не падает, если браузер запрещает хранить данные) =====
const store = {
  get(k, def) {
    try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const key = () => 'u' + (cur + 1);
function loadDone() {
  const v = store.get(key(), []);
  return Array.isArray(v) ? v.filter(n => Number.isInteger(n) && n >= 0 && n < data.length) : [];
}

// ===== Состояние =====
let cur = parseInt(store.get('lesson', 0), 10);
if (!(cur >= 0 && cur < lessons.length)) cur = 0;
let data = lessons[cur];
let done = [];
let run = false;   // идёт ли сейчас тренировка
let sess = 0;      // номер текущего прослушивания микрофона (старые ответы игнорируются)
let sayId = 0;     // номер текущей фразы диктора (старые «договорил» игнорируются)
let ttsSilent = false; // диктор не начал говорить (нет звука)
let ttsErr = null;     // последняя ошибка диктора
let micErr = null;     // последняя ошибка микрофона (кроме «ничего не сказали»)

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== Уроки и карточки =====
function openLesson(n) {
  stopAll();
  cur = n;
  data = lessons[cur];
  store.set('lesson', cur);
  done = loadDone();
  const t = 'Урок ' + (cur + 1) + ': Тренажёр';
  $('ttl').textContent = t;
  document.title = t;
  document.querySelectorAll('.tab').forEach((b, k) => b.classList.toggle('on', k === cur));
  draw();
  window.scrollTo(0, 0);
}

function draw() {
  $('list').innerHTML = data.map((p, i) => {
    const chips = p.w.map((x, k) =>
      `<div class="chip" onclick="sayWord(${i},${k})"><b>🔊 ${esc(x.e)}</b> <span style="color:#1a56db">${esc(x.t)}</span> <span style="color:#4b5563">${esc(x.r)}</span></div>`
    ).join('');
    return `<div class="card ${done.includes(i) ? 'done' : ''}" id="c${i}">` +
      `<div class="head"><div>` +
      `<div class="en" onclick="sayPhrase(${i})">${i + 1}. ${esc(p.en)}<span class="ok">✓</span></div>` +
      `<div class="tr">${esc(p.tr)}</div><div class="ru">${esc(p.ru)}</div>` +
      `</div><button class="btn" onclick="go(${i})">▶ Начать</button></div>` +
      `<div class="st" id="s${i}"></div><div class="words">${chips}</div></div>`;
  }).join('');
  showProgress();
}

function showProgress() {
  $('prog').textContent = `Изучено: ${done.length} из ${data.length}`;
}

function resetAll() {
  stopAll();
  done = [];
  store.del(key());
  draw();
}

// ===== Голос диктора =====
// cb вызывается ровно один раз, когда диктор договорил.
// Страховка по времени: в Chrome иногда не приходит сигнал «договорил» и тренажёр зависал.
function say(text, lang, cb) {
  const id = ++sayId;
  let finished = false;
  let spoke = false; // диктор действительно начал говорить (пришёл сигнал «начал»)
  const finish = () => {
    if (finished || id !== sayId) return;
    finished = true;
    clearTimeout(timer);
    if (cb) cb(spoke);
  };
  // Сигнала «договорил» нет слишком долго, и он даже не начинал — значит, звука нет
  const timer = setTimeout(() => {
    if (HAS_TTS && !spoke && id === sayId) { ttsSilent = true; quickCheck(); }
    finish();
  }, 4000 + text.length * 150);
  if (!HAS_TTS) { clearTimeout(timer); setTimeout(finish, 300); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.rate = 0.9;
    u.onstart = () => { spoke = true; if (ttsSilent || ttsErr) { ttsSilent = false; ttsErr = null; quickCheck(); } };
    u.onend = () => { spoke = true; finish(); };
    u.onerror = e => {
      const code = e && e.error;
      if (code && code !== 'interrupted' && code !== 'canceled') { ttsErr = code; quickCheck(); }
      finish();
    };
    say.u = u; // держим ссылку, иначе Chrome может «потерять» фразу и не сообщить об окончании
    window.speechSynthesis.speak(u);
  } catch (e) { clearTimeout(timer); setTimeout(finish, 300); }
}

// Явно выбираем голос нужного языка (иначе на некоторых телефонах русский читает английский голос)
function pickVoice(lang) {
  let vs = [];
  try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
  const norm = l => String(l || '').replace('_', '-').toLowerCase();
  const want = norm(lang), base = want.slice(0, 2);
  return vs.find(v => norm(v.lang) === want) || vs.find(v => norm(v.lang).startsWith(base)) || null;
}
if (HAS_TTS) try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => quickCheck(); } catch (e) {}

function hush() {
  sayId++;
  if (HAS_TTS) try { window.speechSynthesis.cancel(); } catch (e) {}
}

// Нажатие на фразу или слово — просто послушать (тренировка при этом останавливается)
function sayPhrase(i) { stopAll(); say(data[i].en, 'en-US'); }
function sayWord(i, k) { stopAll(); say(data[i].w[k].e, 'en-US'); }

// ===== Строка состояния под фразой =====
function st(i, text, bg, color) {
  const e = $('s' + i);
  if (!e) return;
  e.textContent = text;
  e.style.background = bg;
  e.style.color = color;
}

function setStopBtn(show) {
  $('stopBtn').style.display = show ? 'inline-block' : 'none';
}

// ===== Тренировка =====
function stopAll() {
  run = false;
  sess++;
  hush();
  if (rec) try { rec.abort(); } catch (e) {}
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  setStopBtn(false);
  if (fullBusy) { fullBusy = false; quickCheck(); } // прервали полную проверку
}

function go(i) {
  stopAll();
  run = true;
  setStopBtn(true);
  step(i);
}

// Фраза i: английский → перевод → микрофон
function step(i) {
  if (!run) { stopAll(); return; }
  if (i >= data.length) { finishLesson(); return; }
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  const c = $('c' + i);
  c.classList.add('active');
  c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');
  say(data[i].en, 'en-US', () => {
    if (!run) return;
    st(i, '🇷🇺 Перевод...', '#eff6ff', '#1e40af');
    say(data[i].ru, 'ru-RU', () => { if (run) listen(i); });
  });
}

// После последней фразы — поздравление (карточка остаётся открытой, чтобы надпись была видна)
function finishLesson() {
  run = false;
  sess++;
  setStopBtn(false);
  st(data.length - 1, `🎉 Урок пройден! Изучено ${done.length} из ${data.length}.` +
    (done.length < data.length ? ' Фразы без ✓ можно повторить кнопкой «▶ Начать».' : ''), '#ecfdf5', '#065f46');
}

// Включает микрофон для фразы i (без озвучки)
function listen(i) {
  if (!run) return;
  if (!rec) {
    run = false;
    setStopBtn(false);
    st(i, '⚠️ В этом браузере нет микрофона для распознавания речи. Откройте сайт в Chrome (Android, компьютер) или Safari (iPhone).', '#fef2f2', '#991b1b');
    return;
  }
  const my = ++sess;
  let got = false;      // ответ уже обработан
  let started = false;  // наш сеанс микрофона действительно запустился
  const mine = () => run && my === sess && started && !got;
  st(i, (ttsSilent ? '🔇 Диктора не слышно — проверьте громкость. ' : '') + '🎙️ Говорите по-английски...', '#fefce8', '#854d0e');

  rec.onresult = e => {
    if (!mine()) return;
    got = true;
    clearTimeout(guard);
    if (micErr) { micErr = null; quickCheck(); }
    const res = e.results[0];
    let best = null;
    for (let k = 0; k < res.length; k++) {
      const r = check(data[i].en, res[k].transcript);
      if (!best || r.missing.length < best.missing.length) best = r;
    }
    if (best.ok) success(i, best.said);
    else fail(i, '❌ Неправильно. Услышано: «' + best.said + '». Не хватает: ' + best.missing.join(', '));
  };
  rec.onerror = e => {
    if (!mine() || e.error === 'aborted') return;
    got = true;
    clearTimeout(guard);
    if (e.error !== 'no-speech') { micErr = e.error; quickCheck(); }
    fail(i, MIC_ERR[e.error] || ('🤔 Микрофон не сработал (код: ' + e.error + '). Нажмите «Повторить» или «🔧 Проверить звук и микрофон» вверху страницы.'));
  };
  rec.onend = () => {
    if (!mine()) return;
    got = true;
    clearTimeout(guard);
    fail(i, MIC_ERR['no-speech']);
  };

  // Ограничение по времени: если браузер ничего не сообщил за 15 секунд — считаем, что не расслышал
  const guard = setTimeout(() => {
    if (!run || my !== sess || got) return;
    got = true;
    try { rec.abort(); } catch (e) {}
    fail(i, MIC_ERR['no-speech']);
  }, 15000);

  // Если прошлое прослушивание ещё не закончилось, браузер не даёт включить микрофон — пробуем снова
  const tryStart = n => {
    if (!run || my !== sess || got) return;
    try { rec.start(); started = true; }
    catch (e) { if (n < 15) setTimeout(() => tryStart(n + 1), 200); }
  };
  tryStart(0);
}

const MIC_ERR = {
  'no-speech': '🤔 Не расслышал. Попробуйте ещё раз',
  'not-allowed': '🚫 Нет доступа к микрофону. Разрешите его: нажмите на значок 🔒 (или ⓘ) слева от адреса сайта → «Микрофон» → «Разрешить», затем «Повторить». На iPhone: Настройки → Safari → Микрофон → Разрешить.',
  'audio-capture': '🎤 Микрофон не найден. Проверьте, что он подключён и не занят другой программой, затем нажмите «Повторить».',
  'network': '📶 Нет интернета — распознавание речи без него не работает. Проверьте связь и нажмите «Повторить».',
};
MIC_ERR['service-not-allowed'] = MIC_ERR['not-allowed'];

function success(i, said) {
  st(i, '✅ Отлично! Вы сказали: ' + said, '#ecfdf5', '#065f46');
  if (!done.includes(i)) {
    done.push(i);
    store.set(key(), done);
    $('c' + i).classList.add('done');
    showProgress();
  }
  say('Okay!', 'en-US', () => {
    if (run) setTimeout(() => step(i + 1), 400);
  });
}

// Ошибка: показываем надпись и кнопки, сами ничего не повторяем
function fail(i, text) {
  st(i, text, '#fef2f2', '#991b1b');
  const e = $('s' + i);
  if (!e) return;
  const b = document.createElement('div');
  b.className = 'acts';
  b.innerHTML = `<button class="mini" onclick="retry(${i})">🎙 Повторить</button><button class="mini alt" onclick="listenAgain(${i})">🔊 Послушать</button>`;
  e.appendChild(b);
}

function retry(i) {
  run = true;
  setStopBtn(true);
  listen(i);
}

function listenAgain(i) {
  run = true;
  setStopBtn(true);
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');
  say(data[i].en, 'en-US', () => { if (run) listen(i); });
}

// ===== Проверка ответа =====
// Приводим текст к простому виду: маленькие буквы, раскрытые сокращения, числа словами
const NUM = {'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten',
  '11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen','16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen',
  '20':'twenty','30':'thirty','40':'forty','50':'fifty','60':'sixty','70':'seventy','80':'eighty','90':'ninety','100':'hundred'};
function words(s) {
  s = s.toLowerCase().replace(/[’‘`]/g, "'");
  s = s.replace(/\$\s?(\d+)/g, '$1 dollars');
  // сокращения → полные формы (I'm = I am, don't = do not, can't = can not ...)
  s = s.replace(/\bcan't\b|\bcannot\b/g, 'can not').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not')
       .replace(/\b(dont|doesnt|didnt|isnt|arent|wasnt)\b/g, w => w.slice(0, -2) + ' not')
       .replace(/\bi'm\b/g, 'i am').replace(/'re\b/g, ' are').replace(/'ll\b/g, ' will').replace(/'ve\b/g, ' have')
       .replace(/\bi'd\b/g, 'i would').replace(/\b(it|that|what|he|she|there|here)'s\b/g, '$1 is');
  // как ещё распознавание может записать то же самое
  s = s.replace(/\bwanna\b/g, 'want to').replace(/\bgonna\b/g, 'going to').replace(/\bgotta\b/g, 'got to')
       .replace(/\beveryday\b/g, 'every day').replace(/\bon[- ]line\b/g, 'online').replace(/\btravell/g, 'travel')
       .replace(/\bok\b/g, 'okay');
  s = s.replace(/[^a-z0-9\s]/g, ' ');
  return s.split(/\s+/).filter(Boolean).map(w => NUM[w] || w);
}

// Сказаны ли все слова фразы (в длинной фразе, от 5 слов, прощаем одно)
function check(expected, said) {
  const need = words(expected), got = words(said);
  const pool = {};
  got.forEach(w => pool[w] = (pool[w] || 0) + 1);
  const missing = [];
  need.forEach(w => { if (pool[w] > 0) pool[w]--; else missing.push(w); });
  const allowed = need.length >= 5 ? 1 : 0;
  return { ok: missing.length <= allowed, missing, said };
}

// ===== Запуск =====
if (!HAS_TTS || !rec) {
  const miss = [!HAS_TTS && 'голоса диктора', !rec && 'распознавания речи'].filter(Boolean).join(' и ');
  $('warn').innerHTML = '⚠️ В этом браузере нет ' + miss + '. Фразы можно читать, но для полной тренировки откройте сайт в <b>Chrome</b> (Android, компьютер) или <b>Safari</b> (iPhone). Если открыли из Telegram — нажмите «⋮» → «Открыть в браузере».';
  $('warn').style.display = 'block';
}
// ===== Самопроверка =====
// При открытии сайта сама проверяет всё, что можно без нажатия: браузер, интернет, голоса, разрешение микрофона.
// Включить звук и микрофон без нажатия браузер не разрешает — для этого кнопка «🔧 Проверить звук и микрофон».
const MIC_SHORT = {
  'not-allowed': '🚫 микрофон запрещён для сайта (значок 🔒 слева от адреса → Микрофон → Разрешить)',
  'service-not-allowed': '🚫 распознавание речи запрещено в браузере',
  'audio-capture': '🎤 микрофон не найден или занят другой программой (громкая связь, голосовой помощник)',
  'network': '📶 нет интернета — распознавание речи не работает',
};
function chkShow(cls, text) {
  $('chk').className = 'chk' + (cls ? ' ' + cls : '');
  $('chkT').textContent = text;
}
function voicesNow() {
  try { return window.speechSynthesis.getVoices() || []; } catch (e) { return []; }
}
function waitVoices(ms) {
  return new Promise(res => {
    const t0 = Date.now();
    const tick = () => (voicesNow().length || Date.now() - t0 > ms) ? res(voicesNow()) : setTimeout(tick, 200);
    tick();
  });
}
let chkNo = 0;
let fullBusy = false;
async function quickCheck() {
  if (fullBusy) return;
  const my = ++chkNo;
  const p = [];
  if (!HAS_TTS) p.push('нет голоса диктора в этом браузере');
  if (!rec) p.push('нет распознавания речи в этом браузере');
  if (navigator.onLine === false) p.push('📶 нет интернета');
  if (HAS_TTS) {
    const vs = await waitVoices(3000);
    if (my !== chkNo) return;
    const has = l => vs.some(v => String(v.lang || '').replace('_', '-').toLowerCase().startsWith(l));
    if (!vs.length) p.push('🔇 голоса диктора не загрузились');
    else {
      if (!has('en')) p.push('нет английского голоса');
      if (!has('ru')) p.push('нет русского голоса');
    }
    if (ttsSilent) p.push('🔇 диктора не слышно — проверьте громкость и источник звука');
    else if (ttsErr === 'not-allowed') p.push('🔇 браузер не дал диктору говорить — нажмите «▶ Начать» или «🔧 Проверить»');
    else if (ttsErr) p.push('🔇 ошибка диктора (' + ttsErr + ')');
  }
  if (rec) {
    let denied = false;
    try {
      const perm = await navigator.permissions.query({ name: 'microphone' });
      if (my !== chkNo) return;
      denied = perm.state === 'denied';
      perm.onchange = () => { if (perm.state !== 'denied' && micErr === 'not-allowed') micErr = null; quickCheck(); };
    } catch (e) {}
    if (my !== chkNo) return;
    if (denied) p.push(MIC_SHORT['not-allowed']);
    if (micErr && !(denied && micErr === 'not-allowed')) p.push(MIC_SHORT[micErr] || ('🎤 ошибка микрофона (' + micErr + ')'));
  }
  if (p.length) chkShow('bad', '⚠️ ' + p.join('; '));
  else chkShow('good', '✅ Готов к работе');
}

// Полная проверка по нажатию: диктор говорит фразу, потом микрофон слушает
function fullCheck() {
  stopAll();
  if (!HAS_TTS && !rec) { quickCheck(); return; }
  fullBusy = true;
  chkNo++;
  chkShow('', '🔊 Сейчас прозвучит фраза...');
  say('Hello! Say: hello.', 'en-US', spoke => {
    const sound = !HAS_TTS ? 'нет голоса в браузере' : spoke ? null : 'диктора не слышно';
    if (HAS_TTS) { ttsSilent = !spoke; if (spoke) ttsErr = null; }
    if (!rec) return fullDone(sound, 'нет распознавания речи в браузере');
    const my = ++sess;
    let got = false;
    let heard = '';
    const end = text => {
      if (got || my !== sess) return;
      got = true;
      clearTimeout(g);
      try { rec.abort(); } catch (e) {}
      fullDone(sound, text, heard);
    };
    rec.onresult = e => {
      try { heard = e.results[0][0].transcript || ''; } catch (x) {}
      micErr = null;
      end(heard ? '' : 'ничего не распознал');
    };
    rec.onerror = e => {
      if (e.error === 'aborted') return;
      if (e.error !== 'no-speech') micErr = e.error;
      end(e.error === 'no-speech' ? 'ничего не услышал' : (MIC_SHORT[e.error] || 'ошибка ' + e.error));
    };
    rec.onend = () => end('ничего не услышал');
    const g = setTimeout(() => end('ничего не услышал за 8 секунд'), 8000);
    chkShow('', '🎙️ Скажите в микрофон: hello');
    const tryStart = n => {
      if (got || my !== sess) return;
      try { rec.start(); }
      catch (e) { if (n < 15) setTimeout(() => tryStart(n + 1), 200); else end('не удалось включить'); }
    };
    tryStart(0);
  });
}
function fullDone(sound, mic, heard) {
  fullBusy = false;
  chkNo++;
  const h = heard ? ' Услышано: «' + heard + '».' : '';
  if (!sound && !mic) chkShow('good', '✅ Готов к работе: звук и микрофон работают.' + h);
  else chkShow('bad', '⚠️ Звук: ' + (sound ? '❌ ' + sound : '✅') + '. Микрофон: ' + (mic ? '❌ ' + mic : '✅') + '.' + h);
}

window.addEventListener('online', quickCheck);
window.addEventListener('offline', quickCheck);
document.addEventListener('visibilitychange', () => { if (!document.hidden) quickCheck(); });

openLesson(cur);
quickCheck();
</script>
