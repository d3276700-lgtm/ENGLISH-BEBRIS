  {en:"This thing doesn't interest me.", tr:"[зис синг дАзнт Интрэст ми:]", ru:"Эта вещь меня не интересует.", w:[{e:"thing",t:"[синг]",r:"вещь"},{e:"interest",t:"[Интрэст]",r:"интересовать"}]},
  {en:"I think it's a good idea.", tr:"[ай синк итс э гуд айдИэ]", ru:"Я думаю, это хорошая идея.", w:[{e:"think",t:"[синк]",r:"думать"},{e:"good idea",t:"[гуд айдИэ]",r:"хорошая идея"}]},
  {en:"I need your help.", tr:"[ай нИ:д йО: хэлп]", ru:"Мне нужна твоя помощь.", w:[{e:"need",t:"[нИ:д]",r:"нуждаться"},{e:"your",t:"[йО:]",r:"твой"}]},
  {en:"She needs this information.", tr:"[ши нИ:дз зис инфомЭЙшн]", ru:"Ей нужна эта информация.", w:[{e:"needs",t:"[нИ:дз]",r:"нуждается"},{e:"information",t:"[инфомЭЙшн]",r:"информация"}]}
];
const lessons = [L1, L2, L3];
let cur = parseInt(localStorage.getItem('lesson') || '0', 10);
if (!(cur >= 0 && cur < lessons.length)) cur = 0;
let data = lessons[cur];
const key = () => 'u' + (cur + 1);
let run = false, done = JSON.parse(localStorage.getItem(key()) || '[]'), rec = null, sess = 0;

function openLesson(n) {
  stopAll();
  cur = n;
  data = lessons[cur];
  localStorage.setItem('lesson', String(cur));
  done = JSON.parse(localStorage.getItem(key()) || '[]');
  document.getElementById('ttl').textContent = 'Урок ' + (cur + 1) + ': Тренажёр';
  document.title = 'Урок ' + (cur + 1) + ': Тренажёр';
  document.querySelectorAll('.tab').forEach((t, k) => t.classList.toggle('on', k === cur));
  draw();
  window.scrollTo(0, 0);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) { rec = new SR(); rec.lang = 'en-US'; }

function draw() {
  const el = document.getElementById('list'); el.innerHTML = '';
  data.forEach((p, i) => {
    const wHtml = p.w.map(x => `<div class="chip" onclick="say('${x.e.replace(/'/g,"\\'")}','en-US')"><b>🔊 ${x.e}</b> <span style="color:#1a56db">${x.t}</span> <span style="color:#4b5563">${x.r}</span></div>`).join('');
    el.innerHTML += `<div class="card ${done.includes(i)?'done':''}" id="c${i}"><div class="head"><div><div class="en" onclick="say('${p.en.replace(/'/g,"\\'")}','en-US')">${i+1}. ${p.en}<span class="ok">✓</span></div><div class="tr">${p.tr}</div><div class="ru">${p.ru}</div></div><button class="btn" onclick="go(${i})">▶ Начать</button></div><div class="st" id="s${i}"></div><div class="words">${wHtml}</div></div>`;
  });
  document.getElementById('prog').textContent = `Изучено: ${done.length} из ${data.length}`;
}

function resetAll() {
  done = [];
  localStorage.removeItem(key());
  draw();
}

function say(t, l, cb) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = l;
  u.rate = 0.9;
  u.onend = cb;
  u.onerror = cb;
  window.speechSynthesis.speak(u);
}

function st(i, t, bg, c) {
  const e = document.getElementById('s' + i);
  if (e) {
    e.textContent = t;
    e.style.background = bg;
    e.style.color = c;
  }
}

function stopAll() {
  run = false;
  sess++;
  window.speechSynthesis.cancel();
  if (rec) try { rec.abort(); } catch (e) {}
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.getElementById('stopBtn').style.display = 'none';
}

function go(i) {
  stopAll();
  run = true;
  document.getElementById('stopBtn').style.display = 'inline-block';
  step(i);
}

function step(i) {
  if (!run || i >= data.length) {
    stopAll();
    return;
  }
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const c = document.getElementById('c' + i);
  c.classList.add('active');
  c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');

  say(data[i].en, 'en-US', () => {
    if (!run) return;
    st(i, '🇷🇺 Перевод...', '#eff6ff', '#1e40af');
    say(data[i].ru, 'ru-RU', () => {
      if (!run) return;
      listen(i);
    });
  });
}

// Включает микрофон для фразы i (без озвучки)
function listen(i) {
  if (!run) return;
  const c = document.getElementById('c' + i);
  if (!rec) {
    st(i, '⚠️ Микрофон не поддерживается браузером', '#fef2f2', '#991b1b');
    return;
  }
  const my = ++sess;
  let got = false;
  st(i, '🎙️ Говорите по-английски...', '#fefce8', '#854d0e');
  rec.onresult = e => {
    if (!run || my !== sess) return;
    got = true;
    const said = e.results[0][0].transcript;
    const cl = s => s.toLowerCase().replace(/[^a-z\s]/g, '').trim();
    if (cl(said) === cl(data[i].en) || (cl(data[i].en).includes(cl(said)) && cl(said).length > 4)) {
      st(i, '✅ Отлично! Вы сказали: ' + said, '#ecfdf5', '#065f46');
      if (!done.includes(i)) {
        done.push(i);
        localStorage.setItem(key(), JSON.stringify(done));
        c.classList.add('done');
        document.getElementById('prog').textContent = `Изучено: ${done.length} из ${data.length}`;
      }
      say('Okay!', 'en-US', () => {
        if (run) setTimeout(() => step(i + 1), 400);
      });
    } else {
      fail(i, '❌ Неправильно. Услышано: «' + said + '»');
    }
  };
  rec.onerror = e => {
    if (!run || my !== sess || got || e.error === 'aborted') return;
    got = true;
    fail(i, '🤔 Не расслышал. Попробуйте ещё раз');
  };
  rec.onend = () => {
    if (!run || my !== sess || got) return;
    got = true;
    fail(i, '🤔 Не расслышал. Попробуйте ещё раз');
  };
  try { rec.start(); } catch (e) {}
}

// Ошибка: показываем надпись и кнопки, сами ничего не повторяем
function fail(i, text) {
  st(i, text, '#fef2f2', '#991b1b');
  const e = document.getElementById('s' + i);
  if (!e) return;
  const b = document.createElement('div');
  b.className = 'acts';
  b.innerHTML = `<button class="mini" onclick="retry(${i})">🎙 Повторить</button><button class="mini alt" onclick="listenAgain(${i})">🔊 Послушать</button>`;
  e.appendChild(b);
}

function retry(i) {
  run = true;
  document.getElementById('stopBtn').style.display = 'inline-block';
  listen(i);
}

function listenAgain(i) {
  run = true;
  document.getElementById('stopBtn').style.display = 'inline-block';
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');
  say(data[i].en, 'en-US', () => { if (run) listen(i); });
}

openLesson(cur);
</script>
</body>
</html>
