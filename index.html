  {en:"My friend doesn't live in Moscow.", tr:"[май фрэнд дАзнт лив ин мОскоу]", ru:"Мой друг не живёт в Москве.", w:[{e:"my friend",t:"[май фрэнд]",r:"мой друг"}]},
  {en:"This thing doesn't interest me.", tr:"[зис синг дАзнт Интрэст ми:]", ru:"Эта вещь меня не интересует.", w:[{e:"thing",t:"[синг]",r:"вещь"},{e:"interest",t:"[Интрэст]",r:"интересовать"}]},
  {en:"I think it's a good idea.", tr:"[ай синк итс э гуд айдИэ]", ru:"Я думаю, это хорошая идея.", w:[{e:"think",t:"[синк]",r:"думать"},{e:"good idea",t:"[гуд айдИэ]",r:"хорошая идея"}]},
  {en:"I need your help.", tr:"[ай нИ:д йО: хэлп]", ru:"Мне нужна твоя помощь.", w:[{e:"need",t:"[нИ:д]",r:"нуждаться"},{e:"your",t:"[йО:]",r:"твой"}]},
  {en:"She needs this information.", tr:"[ши нИ:дз зис инфомЭЙшн]", ru:"Ей нужна эта информация.", w:[{e:"needs",t:"[нИ:дз]",r:"нуждается"},{e:"information",t:"[инфомЭЙшн]",r:"информация"}]}
];
const lessons = [L1, L2, L3];

// ===== Что умеет браузер =====
// Во встроенном браузере Telegram (Android) и в некоторых других нет голоса диктора и/или микрофона.
// Раньше из-за этого сайт падал. Теперь он просто работает без этих функций и показывает подсказку.
const HAS_TTS = !!window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  try { rec = new SR(); rec.lang = 'en-US'; rec.maxAlternatives = 5; } catch (e) { rec = null; }
}

// ===== Сохранение прогресса (не падает, если браузер запрещает хранить данные) =====
const store = {
  get(k, def) {
    try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
  },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const key = () => 'u' + (cur + 1);
function loadDone() {
  const v = store.get(key(), []);
  return Array.isArray(v) ? v.filter(n => Number.isInteger(n) && n >= 0 && n < data.length) : [];
}

// ===== Состояние =====
let cur = parseInt(store.get('lesson', 0), 10);
if (!(cur >= 0 && cur < lessons.length)) cur = 0;
let data = lessons[cur];
let done = [];
let run = false;   // идёт ли сейчас тренировка
let sess = 0;      // номер текущего прослушивания микрофона (старые ответы игнорируются)
let sayId = 0;     // номер текущей фразы диктора (старые «договорил» игнорируются)

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== Уроки и карточки =====
function openLesson(n) {
  stopAll();
  cur = n;
  data = lessons[cur];
  store.set('lesson', cur);
  done = loadDone();
  const t = 'Урок ' + (cur + 1) + ': Тренажёр';
  $('ttl').textContent = t;
  document.title = t;
  document.querySelectorAll('.tab').forEach((b, k) => b.classList.toggle('on', k === cur));
  draw();
  window.scrollTo(0, 0);
}

function draw() {
  $('list').innerHTML = data.map((p, i) => {
    const chips = p.w.map((x, k) =>
      `<div class="chip" onclick="sayWord(${i},${k})"><b>🔊 ${esc(x.e)}</b> <span style="color:#1a56db">${esc(x.t)}</span> <span style="color:#4b5563">${esc(x.r)}</span></div>`
    ).join('');
    return `<div class="card ${done.includes(i) ? 'done' : ''}" id="c${i}">` +
      `<div class="head"><div>` +
      `<div class="en" onclick="sayPhrase(${i})">${i + 1}. ${esc(p.en)}<span class="ok">✓</span></div>` +
      `<div class="tr">${esc(p.tr)}</div><div class="ru">${esc(p.ru)}</div>` +
      `</div><button class="btn" onclick="go(${i})">▶ Начать</button></div>` +
      `<div class="st" id="s${i}"></div><div class="words">${chips}</div></div>`;
  }).join('');
  showProgress();
}

function showProgress() {
  $('prog').textContent = `Изучено: ${done.length} из ${data.length}`;
}

function resetAll() {
  stopAll();
  done = [];
  store.del(key());
  draw();
}

// ===== Голос диктора =====
// cb вызывается ровно один раз, когда диктор договорил.
// Страховка по времени: в Chrome иногда не приходит сигнал «договорил» и тренажёр зависал.
function say(text, lang, cb) {
  const id = ++sayId;
  let finished = false;
  const finish = () => {
    if (finished || id !== sayId) return;
    finished = true;
    clearTimeout(timer);
    if (cb) cb();
  };
  const timer = setTimeout(finish, 4000 + text.length * 150);
  if (!HAS_TTS) { clearTimeout(timer); setTimeout(finish, 300); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    u.onend = finish;
    u.onerror = finish;
    say.u = u; // держим ссылку, иначе Chrome может «потерять» фразу и не сообщить об окончании
    window.speechSynthesis.speak(u);
  } catch (e) { clearTimeout(timer); setTimeout(finish, 300); }
}

function hush() {
  sayId++;
  if (HAS_TTS) try { window.speechSynthesis.cancel(); } catch (e) {}
}

// Нажатие на фразу или слово — просто послушать (тренировка при этом останавливается)
function sayPhrase(i) { stopAll(); say(data[i].en, 'en-US'); }
function sayWord(i, k) { stopAll(); say(data[i].w[k].e, 'en-US'); }

// ===== Строка состояния под фразой =====
function st(i, text, bg, color) {
  const e = $('s' + i);
  if (!e) return;
  e.textContent = text;
  e.style.background = bg;
  e.style.color = color;
}

function setStopBtn(show) {
  $('stopBtn').style.display = show ? 'inline-block' : 'none';
}

// ===== Тренировка =====
function stopAll() {
  run = false;
  sess++;
  hush();
  if (rec) try { rec.abort(); } catch (e) {}
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  setStopBtn(false);
}

function go(i) {
  stopAll();
  run = true;
  setStopBtn(true);
  step(i);
}

// Фраза i: английский → перевод → микрофон
function step(i) {
  if (!run || i >= data.length) { stopAll(); return; }
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  const c = $('c' + i);
  c.classList.add('active');
  c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');
  say(data[i].en, 'en-US', () => {
    if (!run) return;
    st(i, '🇷🇺 Перевод...', '#eff6ff', '#1e40af');
    say(data[i].ru, 'ru-RU', () => { if (run) listen(i); });
  });
}

// Включает микрофон для фразы i (без озвучки)
function listen(i) {
  if (!run) return;
  if (!rec) {
    run = false;
    setStopBtn(false);
    st(i, '⚠️ В этом браузере нет микрофона для распознавания речи. Откройте сайт в Chrome (Android, компьютер) или Safari (iPhone).', '#fef2f2', '#991b1b');
    return;
  }
  const my = ++sess;
  let got = false;
  st(i, '🎙️ Говорите по-английски...', '#fefce8', '#854d0e');

  rec.onresult = e => {
    if (!run || my !== sess || got) return;
    got = true;
    const res = e.results[0];
    let best = null;
    for (let k = 0; k < res.length; k++) {
      const r = check(data[i].en, res[k].transcript);
      if (!best || r.missing.length < best.missing.length) best = r;
    }
    if (best.ok) success(i, best.said);
    else fail(i, '❌ Неправильно. Услышано: «' + best.said + '». Не хватает: ' + best.missing.join(', '));
  };
  rec.onerror = e => {
    if (!run || my !== sess || got || e.error === 'aborted') return;
    got = true;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      fail(i, '🚫 Нет доступа к микрофону. Разрешите микрофон для этого сайта в настройках браузера.');
    } else {
      fail(i, '🤔 Не расслышал. Попробуйте ещё раз');
    }
  };
  rec.onend = () => {
    if (!run || my !== sess || got) return;
    got = true;
    fail(i, '🤔 Не расслышал. Попробуйте ещё раз');
  };
  try { rec.start(); } catch (e) {}
}

function success(i, said) {
  st(i, '✅ Отлично! Вы сказали: ' + said, '#ecfdf5', '#065f46');
  if (!done.includes(i)) {
    done.push(i);
    store.set(key(), done);
    $('c' + i).classList.add('done');
    showProgress();
  }
  say('Okay!', 'en-US', () => {
    if (run) setTimeout(() => step(i + 1), 400);
  });
}

// Ошибка: показываем надпись и кнопки, сами ничего не повторяем
function fail(i, text) {
  st(i, text, '#fef2f2', '#991b1b');
  const e = $('s' + i);
  if (!e) return;
  const b = document.createElement('div');
  b.className = 'acts';
  b.innerHTML = `<button class="mini" onclick="retry(${i})">🎙 Повторить</button><button class="mini alt" onclick="listenAgain(${i})">🔊 Послушать</button>`;
  e.appendChild(b);
}

function retry(i) {
  run = true;
  setStopBtn(true);
  listen(i);
}

function listenAgain(i) {
  run = true;
  setStopBtn(true);
  st(i, '🔊 Слушайте на английском...', '#eff6ff', '#1e40af');
  say(data[i].en, 'en-US', () => { if (run) listen(i); });
}

// ===== Проверка ответа =====
// Приводим текст к простому виду: маленькие буквы, раскрытые сокращения, числа словами
const NUM = {'1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','20':'twenty'};
function words(s) {
  s = s.toLowerCase().replace(/[’‘`]/g, "'");
  s = s.replace(/\$\s?(\d+)/g, '$1 dollars');
  s = s.replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bi'd\b/g, 'i would').replace(/\bit's\b/g, 'it is').replace(/\bi'm\b/g, 'i am');
  s = s.replace(/[^a-z0-9\s]/g, ' ');
  return s.split(/\s+/).filter(Boolean).map(w => NUM[w] || w);
}

// Сказаны ли все слова фразы (в длинной фразе, от 5 слов, прощаем одно)
function check(expected, said) {
  const need = words(expected), got = words(said);
  const pool = {};
  got.forEach(w => pool[w] = (pool[w] || 0) + 1);
  const missing = [];
  need.forEach(w => { if (pool[w] > 0) pool[w]--; else missing.push(w); });
  const allowed = need.length >= 5 ? 1 : 0;
  return { ok: missing.length <= allowed, missing, said };
}

// ===== Запуск =====
if (!HAS_TTS || !rec) {
  const miss = [!HAS_TTS && 'голоса диктора', !rec && 'распознавания речи'].filter(Boolean).join(' и ');
  $('warn').innerHTML = '⚠️ В этом браузере нет ' + miss + '. Фразы можно читать, но для полной тренировки откройте сайт в <b>Chrome</b> (Android, компьютер) или <b>Safari</b> (iPhone). Если открыли из Telegram — нажмите «⋮» → «Открыть в браузере».';
  $('warn').style.display = 'block';
}
openLesson(cur);
</script>
</body>
</html>
